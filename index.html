<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Location</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="vendor/Leaflet.ImageOverlay.Rotated.js"></script>
<style>
  :root {
    --bg: #ffffff; --fg: #111111; --muted: #666666;
    --accent: #2563eb; --err: #dc2626; --panel: #f4f4f5; --border: #e2e2e2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121212; --fg: #f0f0f0; --muted: #999999;
      --accent: #60a5fa; --panel: #1e1e1e; --border: #2c2c2c;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px);
    display: flex; flex-direction: column; overflow: hidden; }
  header { padding: 8px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
  h1 { font-size: 15px; font-weight: 600; margin: 0; flex: 1; }
  .tabs { display: flex; gap: 4px; }
  .tab { background: var(--panel); border: 1px solid var(--border); color: var(--fg);
    padding: 6px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  #main { position: relative; flex: 1; min-height: 0; }
  #map { position: absolute; inset: 0; }
  .panel { position: absolute; left: 8px; right: 8px; bottom: 8px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px; font-size: 13px; z-index: 500; }
  .panel.hidden { display: none; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
  input[type=text], select { flex: 1; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--fg); font-size: 13px; min-width: 100px; }
  button { background: var(--accent); color: #fff; border: none; padding: 7px 12px; border-radius: 6px;
    font-size: 13px; cursor: pointer; }
  button.secondary { background: var(--panel); color: var(--fg); border: 1px solid var(--border); }
  button:disabled { opacity: 0.5; }
  .muted { color: var(--muted); font-size: 12px; }
  .err { color: var(--err); }
  .overlay { position: absolute; inset: 0; background: var(--bg); z-index: 1000; overflow-y: auto; padding: 10px; }
  .overlay.hidden { display: none; }
  .region-item { display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
  .region-name { font-weight: 600; font-size: 14px; }
  .region-meta { font-size: 12px; color: var(--muted); }
  .region-actions { display: flex; gap: 6px; }
  .progress-wrap { width: 100%; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin: 6px 0; }
  .progress-bar { height: 100%; background: var(--accent); width: 0%; }
  .floating { position: absolute; right: 8px; top: 8px; z-index: 500; display: flex; flex-direction: column; gap: 6px; }
  .fab { width: 40px; height: 40px; border-radius: 50%; background: var(--panel); border: 1px solid var(--border);
    color: var(--fg); font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .fab.on { background: var(--accent); color: #fff; }
  #coords { font-size: 22px; font-weight: 700; letter-spacing: 0.02em; color: var(--fg); position: absolute; left: 8px; top: 8px; z-index: 500;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-variant-numeric: tabular-nums; }
  /* Push Leaflet's zoom control down below the coordinates badge above it */
  .leaflet-top.leaflet-left { margin-top: 58px; }
</style>
</head>
<body>
<header>
  <h1>My Location</h1>
  <div class="tabs">
    <button class="tab active" id="tabCapture">Capture</button>
    <button class="tab" id="tabOffline">Offline</button>
  </div>
</header>

<div id="main">
  <div id="map"></div>
  <div id="coords"></div>

  <div class="floating">
    <div class="fab" id="locateBtn" title="Locate">◎</div>
    <div class="fab" id="trackBtn" title="Track">➜</div>
  </div>

  <div class="floating" id="trailOpacityBar" style="display:none; top:auto; bottom:8px; right:8px; left:8px; flex-direction:row; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:8px 12px;">
    <span class="muted" style="font-size:12px; white-space:nowrap;">Map opacity</span>
    <input type="range" id="trailOpacitySlider" min="0.1" max="1" step="0.05" value="0.85" style="flex:1;">
  </div>

  <!-- Capture panel -->
  <div class="panel" id="capturePanel">
    <div class="row"><span id="captureStatus" class="muted">Pan/zoom to the area you want, then save it.</span></div>
    <div class="row">
      <input type="text" id="regionName" placeholder="Region name (e.g. Pleasanton)">
    </div>
    <div class="row">
      <select id="zoomDepth">
        <option value="0">Overview only (smallest)</option>
        <option value="2" selected>Neighborhood detail</option>
        <option value="4">Street-level detail (largest)</option>
      </select>
      <button id="saveRegionBtn">Save this view</button>
    </div>
    <div class="row muted" id="estimateRow"></div>
    <div class="row" style="border-top: 1px solid var(--border); padding-top: 8px; margin-top: 2px;">
      <input type="file" id="pdfFileInput" accept="application/pdf" style="display:none;">
      <button class="secondary" id="addTrailMapBtn">Add PDF trail map</button>
      <span class="muted" id="pdfStatus"></span>
    </div>
    <div class="row muted" id="swStatus"></div>
  </div>

  <!-- Download progress overlay -->
  <div class="overlay hidden" id="progressOverlay">
    <h2 style="font-size:15px;">Downloading region…</h2>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="muted" id="progressText"></div>
    <div class="row" style="margin-top:10px;"><button class="secondary" id="cancelDownloadBtn">Cancel</button></div>
  </div>

  <!-- Offline content overlay: saved regions + trail maps -->
  <div class="overlay hidden" id="regionListOverlay">
    <div class="row" style="justify-content: space-between;">
      <h2 style="font-size:15px; margin:0;">Saved regions</h2>
    </div>
    <div class="muted" id="regionListTotal" style="margin-bottom:8px;"></div>
    <div id="regionList"></div>
    <div class="muted" id="regionListEmpty" style="display:none;">No regions saved yet. Switch to Capture to download one.</div>

    <div class="row" style="justify-content: space-between; margin-top:18px;">
      <h2 style="font-size:15px; margin:0;">Trail maps</h2>
    </div>
    <div class="muted" id="trailMapListTotal" style="margin-bottom:8px;"></div>
    <div id="trailMapList"></div>
    <div class="muted" id="trailMapListEmpty" style="display:none;">No trail maps added yet. Switch to Capture to add one.</div>
  </div>
</div>

<script>
/* ---------- IndexedDB (region metadata only — tile bytes live in the
   Service Worker's Cache Storage, see below) ---------- */
const DB_NAME = 'gpsmapdb3', DB_VERSION = 1; // renamed again: sidesteps version-upgrade blocking from any lingering old connection
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('regions')) {
        db.createObjectStore('regions', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('trailMaps')) {
        db.createObjectStore('trailMaps', { keyPath: 'id' });
      }
    };
    req.onblocked = () => reject(new Error('Database upgrade blocked — close other tabs/instances of this app and reload.'));
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
let dbPromise = openDB();

async function dbAddRegion(region) {
  const db = await dbPromise;
  return new Promise((res, rej) => {
    const tx = db.transaction('regions', 'readwrite');
    tx.objectStore('regions').put(region);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function dbGetRegions() {
  const db = await dbPromise;
  return new Promise((res, rej) => {
    const tx = db.transaction('regions', 'readonly');
    const req = tx.objectStore('regions').getAll();
    req.onsuccess = () => res(req.result || []);
    req.onerror = () => rej(req.error);
  });
}
async function dbDeleteRegion(id) {
  const db = await dbPromise;
  await new Promise((res, rej) => {
    const tx = db.transaction('regions', 'readwrite');
    tx.objectStore('regions').delete(id);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
  // Note: this removes the region from the list but leaves its tiles in
  // the shared tile cache (other regions may reuse them, and there's no
  // per-tile owner tracking) — harmless, just uses a little extra storage.
}

async function dbAddTrailMap(trailMap) {
  const db = await dbPromise;
  return new Promise((res, rej) => {
    const tx = db.transaction('trailMaps', 'readwrite');
    tx.objectStore('trailMaps').put(trailMap);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function dbGetTrailMaps() {
  const db = await dbPromise;
  return new Promise((res, rej) => {
    const tx = db.transaction('trailMaps', 'readonly');
    const req = tx.objectStore('trailMaps').getAll();
    req.onsuccess = () => res(req.result || []);
    req.onerror = () => rej(req.error);
  });
}
async function dbDeleteTrailMap(id) {
  const db = await dbPromise;
  return new Promise((res, rej) => {
    const tx = db.transaction('trailMaps', 'readwrite');
    tx.objectStore('trailMaps').delete(id);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}

/* ---------- Tile math ---------- */
function lon2tile(lon, z) { return Math.floor((lon + 180) / 360 * Math.pow(2, z)); }
function lat2tile(lat, z) {
  const rad = lat * Math.PI / 180;
  return Math.floor((1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * Math.pow(2, z));
}
function tilesForBounds(bounds, minZoom, maxZoom) {
  const tiles = [];
  for (let z = minZoom; z <= maxZoom; z++) {
    const xMin = lon2tile(bounds.getWest(), z), xMax = lon2tile(bounds.getEast(), z);
    const yMin = lat2tile(bounds.getNorth(), z), yMax = lat2tile(bounds.getSouth(), z);
    for (let x = Math.min(xMin,xMax); x <= Math.max(xMin,xMax); x++) {
      for (let y = Math.min(yMin,yMax); y <= Math.max(yMin,yMax); y++) {
        tiles.push({ z, x, y });
      }
    }
  }
  return tiles;
}
const MAX_TILES = 2500;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const TILE_TEMPLATE = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
function tileUrl(z,x,y) { return TILE_TEMPLATE.replace('{z}',z).replace('{x}',x).replace('{y}',y); }
const TILE_CACHE_NAME = 'map-tiles';

/* ---------- Map setup ---------- */
// One persistent tile layer for both modes. The Service Worker (below)
// intercepts these requests: online, it fetches + opportunistically
// caches each tile; offline, it serves from the cache if present.
// tile.openstreetmap.org doesn't send CORS headers, so we can't read
// tile bytes into JS/IndexedDB directly — Cache Storage sidesteps that
// the same way a plain <img> tag does.
const map = L.map('map', { zoomControl: false }).setView([37.6624, -121.8747], 12); // default: Pleasanton, CA
L.control.zoom({ position: 'topleft' }).addTo(map);
const tileLayer = L.tileLayer(TILE_TEMPLATE, {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
});
tileLayer.addTo(map);

/* ---------- GPS marker ---------- */
let marker = null, accCircle = null, watchId = null;
function placeMarker(lat, lng, accuracy) {
  if (!marker) {
    marker = L.marker([lat, lng]).addTo(map);
    accCircle = L.circle([lat, lng], { radius: accuracy || 0, color: '#2563eb', fillOpacity: 0.1 }).addTo(map);
  } else {
    marker.setLatLng([lat, lng]);
    accCircle.setLatLng([lat, lng]).setRadius(accuracy || 0);
  }
  document.getElementById('coords').textContent = lat.toFixed(5) + ', ' + lng.toFixed(5);
}
document.getElementById('locateBtn').addEventListener('click', () => {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    pos => { placeMarker(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy); map.setView([pos.coords.latitude, pos.coords.longitude]); },
    err => { document.getElementById('coords').textContent = 'GPS error: ' + err.message; }
  );
});
document.getElementById('trackBtn').addEventListener('click', function() {
  const btn = this;
  if (watchId) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
    btn.classList.remove('on');
  } else {
    watchId = navigator.geolocation.watchPosition(
      pos => { placeMarker(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy); map.setView([pos.coords.latitude, pos.coords.longitude]); },
      err => { document.getElementById('coords').textContent = 'GPS error: ' + err.message; },
      { enableHighAccuracy: true }
    );
    btn.classList.add('on');
  }
});

/* ---------- Tabs / mode switching ---------- */
const tabCapture = document.getElementById('tabCapture');
const tabOffline = document.getElementById('tabOffline');
const capturePanel = document.getElementById('capturePanel');
const regionListOverlay = document.getElementById('regionListOverlay');

function updateTrailOpacityBarVisibility() {
  const bar = document.getElementById('trailOpacityBar');
  const show = activeTrailLayers.size > 0 && capturePanel.classList.contains('hidden');
  bar.style.display = show ? 'flex' : 'none';
}

function setMode(mode) {
  tabCapture.classList.toggle('active', mode === 'capture');
  tabOffline.classList.toggle('active', mode === 'offline');
  capturePanel.classList.toggle('hidden', mode !== 'capture');
  regionListOverlay.classList.toggle('hidden', mode !== 'offline');
  updateTrailOpacityBarVisibility();

  if (mode === 'capture') {
    map.setMinZoom(0);
    map.setMaxZoom(19);
    updateEstimate();
  } else if (mode === 'offline') {
    renderRegionList();
    renderTrailMapList();
  }
}
tabCapture.addEventListener('click', () => setMode('capture'));
tabOffline.addEventListener('click', () => setMode('offline'));
document.getElementById('trailOpacitySlider').addEventListener('input', (e) => {
  const op = parseFloat(e.target.value);
  activeTrailLayers.forEach(({ layer }) => layer.setOpacity(op));
});

/* ---------- Capture: estimate + save ---------- */
function updateEstimate() {
  const depth = parseInt(document.getElementById('zoomDepth').value, 10);
  const z = map.getZoom();
  const minZoom = z, maxZoom = Math.min(z + depth, 19);
  const tiles = tilesForBounds(map.getBounds(), minZoom, maxZoom);
  const row = document.getElementById('estimateRow');
  if (tiles.length > MAX_TILES) {
    row.innerHTML = `<span class="err">${tiles.length} tiles — too many (max ${MAX_TILES}). Zoom in or lower detail.</span>`;
    document.getElementById('saveRegionBtn').disabled = true;
  } else {
    const estMB = (tiles.length * 15 / 1024).toFixed(1); // rough estimate ~15KB/tile
    row.textContent = `≈ ${tiles.length} tiles, ~${estMB} MB`;
    document.getElementById('saveRegionBtn').disabled = false;
  }
}
map.on('moveend zoomend', () => { if (!capturePanel.classList.contains('hidden')) updateEstimate(); });
document.getElementById('zoomDepth').addEventListener('change', updateEstimate);
updateEstimate();

let downloadCancelled = false;
document.getElementById('saveRegionBtn').addEventListener('click', async () => {
  const name = document.getElementById('regionName').value.trim();
  if (!name) { alert('Give the region a name.'); return; }
  if (!navigator.onLine) { alert('You appear to be offline — connect to the internet to download a region.'); return; }
  if (!navigator.serviceWorker.controller) {
    alert('Offline support is still starting up. Reload the page once, then try downloading again.');
    return;
  }
  const depth = parseInt(document.getElementById('zoomDepth').value, 10);
  const z = map.getZoom();
  const minZoom = z, maxZoom = Math.min(z + depth, 19);
  const bounds = map.getBounds();
  const tiles = tilesForBounds(bounds, minZoom, maxZoom);
  if (tiles.length > MAX_TILES) { alert('Too many tiles — zoom in or lower the detail level.'); return; }

  downloadCancelled = false;
  document.getElementById('progressOverlay').classList.remove('hidden');
  const bar = document.getElementById('progressBar');
  const text = document.getElementById('progressText');
  const regionId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
  const usageBefore = (navigator.storage && navigator.storage.estimate)
    ? (await navigator.storage.estimate()).usage : null;
  let done = 0, failed = 0, lastError = null;
  const tileCache = await caches.open(TILE_CACHE_NAME);

  for (const t of tiles) {
    if (downloadCancelled) break;
    const url = tileUrl(t.z, t.x, t.y);
    try {
      // mode: 'no-cors' — the tile server sends no CORS headers, so a
      // normal fetch() read would be blocked. The response is "opaque"
      // (we can't inspect it) but it caches and replays fine.
      const resp = await fetch(url, { mode: 'no-cors' });
      await tileCache.put(url, resp);
    } catch (e) { failed++; lastError = e; }
    done++;
    bar.style.width = Math.round(done / tiles.length * 100) + '%';
    text.textContent = `${done} / ${tiles.length} tiles` + (failed ? ` (${failed} failed)` : '');
    await sleep(60); // polite pacing against the tile server
  }

  document.getElementById('progressOverlay').classList.add('hidden');
  if (downloadCancelled) return;

  if (failed === tiles.length) {
    alert('Every tile failed to download. Error: ' + (lastError ? (lastError.name + ': ' + lastError.message) : 'unknown') +
      '\n\nCheck you have an internet connection and try again.');
    return;
  }

  let sizeBytes = tiles.length * 15 * 1024; // rough fallback estimate
  if (usageBefore !== null) {
    const usageAfter = (await navigator.storage.estimate()).usage;
    if (usageAfter > usageBefore) sizeBytes = usageAfter - usageBefore;
  }
  try {
    await dbAddRegion({
      id: regionId, name,
      bounds: { n: bounds.getNorth(), s: bounds.getSouth(), e: bounds.getEast(), w: bounds.getWest() },
      minZoom, maxZoom, tileCount: tiles.length, sizeBytes, createdAt: Date.now()
    });
    document.getElementById('regionName').value = '';
    alert(`Saved "${name}" (${tiles.length} tiles` + (failed ? `, ${failed} failed` : '') + ').');
  } catch (e) {
    alert('Tiles downloaded, but saving the region record failed: ' + e.message);
  }
});
document.getElementById('cancelDownloadBtn').addEventListener('click', () => { downloadCancelled = true; });

/* ---------- Offline: region list ---------- */
function fmtSize(bytes) {
  if (bytes > 1024*1024) return (bytes/1024/1024).toFixed(1) + ' MB';
  return Math.round(bytes/1024) + ' KB';
}
async function renderRegionList() {
  const list = document.getElementById('regionList');
  const empty = document.getElementById('regionListEmpty');
  const totalEl = document.getElementById('regionListTotal');
  let regions;
  try {
    regions = await dbGetRegions();
  } catch (e) {
    list.innerHTML = `<div class="err">Couldn't load saved regions: ${e.message}</div>`;
    empty.style.display = 'none';
    totalEl.textContent = '';
    return;
  }
  list.innerHTML = '';
  empty.style.display = regions.length ? 'none' : 'block';
  const totalBytes = regions.reduce((sum, r) => sum + (r.sizeBytes || 0), 0);
  totalEl.textContent = regions.length ? `${regions.length} region${regions.length===1?'':'s'} · ${fmtSize(totalBytes)} total` : '';
  regions.sort((a,b) => b.createdAt - a.createdAt).forEach(r => {
    const item = document.createElement('div');
    item.className = 'region-item';
    item.innerHTML = `
      <div>
        <div class="region-name">${r.name}</div>
        <div class="region-meta">${r.tileCount} tiles · ${fmtSize(r.sizeBytes)} · zoom ${r.minZoom}-${r.maxZoom}</div>
      </div>
      <div class="region-actions">
        <button class="secondary" data-act="open">Open</button>
        <button class="secondary" data-act="delete">Delete</button>
      </div>`;
    item.querySelector('[data-act=open]').addEventListener('click', () => openRegion(r));
    item.querySelector('[data-act=delete]').addEventListener('click', async () => {
      if (confirm(`Delete "${r.name}"?`)) { await dbDeleteRegion(r.id); renderRegionList(); }
    });
    list.appendChild(item);
  });
}
function openRegion(r) {
  regionListOverlay.classList.add('hidden');
  // The tile layer itself doesn't change — the Service Worker serves
  // cached tiles automatically when the network is unavailable. This
  // just points the view at the region's cached area/zoom range.
  map.setMinZoom(r.minZoom);
  map.setMaxZoom(r.maxZoom);
  const center = [(r.bounds.n + r.bounds.s) / 2, (r.bounds.e + r.bounds.w) / 2];
  map.setView(center, r.minZoom);
}

/* ---------- Trail maps: georeferenced PDFs overlaid on the map ----------
   pdf-lib reads the raw /VP (Viewport) dictionary — the GPTS/LPTS corner
   points and BBox that pdf.js's public API doesn't expose. pdf.js renders
   the page itself to an image, which we crop to just the BBox map area and
   overlay with Leaflet.ImageOverlay.Rotated (handles the skew/rotation a
   plain L.imageOverlay can't). Everything happens on-device — the PDF
   never leaves the phone. */
async function waitForMupdf() {
  // Loaded lazily (not on every page load) — this ~10MB WASM library is
  // only needed when actually importing a PDF, not for viewing already-
  // saved regions or trail maps.
  if (!window.mupdf) {
    window.mupdf = await import('./vendor/mupdf.js');
  }
}

async function parseGeoPdf(file) {
  await waitForMupdf();
  const buf = await file.arrayBuffer();

  const doc = mupdf.Document.openDocument(new Uint8Array(buf), 'application/pdf');
  const page = doc.loadPage(0);
  const pageObj = page.getObject();

  // 1. Pull the geospatial corner points from the raw /VP (Viewport) entry.
  const vp0 = pageObj.get('VP', 0);
  if (!vp0 || vp0.isNull()) {
    throw new Error('This PDF has no geospatial referencing (no /VP entry) — it isn\'t a GeoPDF/Avenza-style map.');
  }
  const bbox = vp0.get('BBox').asJS(); // [x0,y0,x1,y1] in PDF points
  const measure = vp0.get('Measure');
  const gpts = measure.get('GPTS').asJS();
  const lpts = measure.get('LPTS').asJS();
  const corners = []; // [{lp:[u,v], gp:[lat,lon]}, ...]
  for (let i = 0; i < lpts.length / 2; i++) {
    corners.push({ lp: [lpts[i*2], lpts[i*2+1]], gp: [gpts[i*2], gpts[i*2+1]] });
  }
  function nearest(u, v) {
    let best = corners[0], bestD = Infinity;
    for (const c of corners) {
      const d = (c.lp[0]-u)**2 + (c.lp[1]-v)**2;
      if (d < bestD) { bestD = d; best = c; }
    }
    return best.gp;
  }
  const topLeftGp = nearest(0, 1), topRightGp = nearest(1, 1), bottomLeftGp = nearest(0, 0);

  // 2. Render the page with MuPDF at a resolution sized to the map area
  // (BBox), not the full sheet (which may include a legend).
  const mediaBox = page.getBounds(); // [x0,y0,x1,y1]
  const bboxWidth = Math.abs(bbox[2] - bbox[0]), bboxHeight = Math.abs(bbox[3] - bbox[1]);
  const targetPx = 2000; // long-side target resolution for the map area
  let scale = targetPx / Math.max(bboxWidth, bboxHeight);
  const fullLongSide = Math.max(mediaBox[2]-mediaBox[0], mediaBox[3]-mediaBox[1]) * scale;
  if (fullLongSide > 4000) scale *= 4000 / fullLongSide; // safety clamp for memory

  // Manual page-space -> pixel-space matrix: MuPDF's own canonical page
  // transform (handles the MediaBox origin and Y-flip correctly) composed
  // with our scale factor — rather than hand-rolling that transform, which
  // risks getting the flip direction wrong.
  const matrix = mupdf.Matrix.concat(page.getTransform(), mupdf.Matrix.scale(scale, scale));
  const pixmap = page.toPixmap(matrix, mupdf.ColorSpace.DeviceRGB, false);
  const pngBytes = pixmap.asPNG();
  const pngBlob = new Blob([pngBytes], { type: 'image/png' });
  const pngUrl = URL.createObjectURL(pngBlob);
  const fullImg = await new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('Failed to decode the rendered page image.'));
    img.src = pngUrl;
  });
  const renderCanvas = document.createElement('canvas');
  renderCanvas.width = pixmap.getWidth();
  renderCanvas.height = pixmap.getHeight();
  const renderCtx = renderCanvas.getContext('2d');
  // Empirically, MuPDF's pixmap output comes out vertically flipped here
  // (confirmed against known label positions on a real map) regardless of
  // which page-transform convention is used to build `matrix` — so the
  // flip is corrected explicitly here rather than by further guessing at
  // MuPDF's internal orientation.
  renderCtx.save();
  renderCtx.translate(0, renderCanvas.height);
  renderCtx.scale(1, -1);
  renderCtx.drawImage(fullImg, 0, 0);
  renderCtx.restore();
  URL.revokeObjectURL(pngUrl);

  // Crop to just the BBox (map) area. Computed as a direct proportion of
  // the full page within renderCanvas — not re-derived through `matrix` —
  // since renderCanvas's orientation is now verified correct (right-side
  // up), and mediaBox/bbox are both in the same PDF-space units, this is a
  // plain, unambiguous proportional mapping with no sign/flip guesswork.
  const mediaBoxW = mediaBox[2] - mediaBox[0], mediaBoxH = mediaBox[3] - mediaBox[1];
  const xFrac0 = (bbox[0] - mediaBox[0]) / mediaBoxW, xFrac1 = (bbox[2] - mediaBox[0]) / mediaBoxW;
  const yFrac0 = (mediaBox[3] - bbox[3]) / mediaBoxH, yFrac1 = (mediaBox[3] - bbox[1]) / mediaBoxH; // PDF y-up -> row-down
  const cropX = Math.min(xFrac0, xFrac1) * renderCanvas.width;
  const cropXEnd = Math.max(xFrac0, xFrac1) * renderCanvas.width;
  const cropY = Math.min(yFrac0, yFrac1) * renderCanvas.height;
  const cropYEnd = Math.max(yFrac0, yFrac1) * renderCanvas.height;
  const cropW = cropXEnd - cropX, cropH = cropYEnd - cropY;
  const cropCanvas = document.createElement('canvas');
  cropCanvas.width = cropW;
  cropCanvas.height = cropH;
  cropCanvas.getContext('2d').drawImage(renderCanvas, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

  const imageBlob = await new Promise(resolve => cropCanvas.toBlob(resolve, 'image/jpeg', 0.85));
  if (!imageBlob) throw new Error('Failed to render the PDF page to an image.');

  return { imageBlob, topLeft: topLeftGp, topRight: topRightGp, bottomLeft: bottomLeftGp };
}

document.getElementById('addTrailMapBtn').addEventListener('click', () => {
  document.getElementById('pdfFileInput').click();
});
document.getElementById('pdfFileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = ''; // allow picking the same file again later
  if (!file) return;
  const status = document.getElementById('pdfStatus');
  status.className = 'muted';
  status.textContent = 'Reading PDF…';
  try {
    const timeout = (ms) => new Promise((_, rej) => setTimeout(() => rej(new Error('Timed out — the PDF may be too large or something went wrong.')), ms));
    const result = await Promise.race([parseGeoPdf(file), timeout(30000)]);
    const name = (prompt('Name this trail map:', file.name.replace(/\.pdf$/i, '')) || file.name).trim();
    if (!name) { status.textContent = ''; return; }
    await dbAddTrailMap({
      id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
      name, imageBlob: result.imageBlob,
      topLeft: result.topLeft, topRight: result.topRight, bottomLeft: result.bottomLeft,
      createdAt: Date.now()
    });
    status.textContent = '';
    renderTrailMapList();
  } catch (err) {
    status.className = 'row err';
    status.textContent = err.message;
  }
});

const activeTrailLayers = new Map(); // id -> {layer, url}
async function renderTrailMapList() {
  const list = document.getElementById('trailMapList');
  const empty = document.getElementById('trailMapListEmpty');
  const totalEl = document.getElementById('trailMapListTotal');
  let maps;
  try {
    maps = await dbGetTrailMaps();
  } catch (e) {
    list.innerHTML = `<div class="err">Couldn't load trail maps: ${e.message}</div>`;
    totalEl.textContent = '';
    return;
  }
  list.innerHTML = '';
  empty.style.display = maps.length ? 'none' : 'block';
  const totalBytes = maps.reduce((sum, m) => sum + (m.imageBlob ? m.imageBlob.size : 0), 0);
  totalEl.textContent = maps.length ? `${maps.length} map${maps.length===1?'':'s'} · ${fmtSize(totalBytes)} total` : '';
  maps.sort((a,b) => b.createdAt - a.createdAt).forEach(m => {
    const item = document.createElement('div');
    item.className = 'region-item';
    const thumbUrl = URL.createObjectURL(m.imageBlob);
    item.innerHTML = `
      <img src="${thumbUrl}" style="width:48px; height:48px; object-fit:cover; border-radius:6px; border:1px solid var(--border); flex-shrink:0;">
      <div style="flex:1;">
        <div class="region-name">${m.name}</div>
        <div class="region-meta">${fmtSize(m.imageBlob.size)}</div>
      </div>
      <div class="region-actions">
        <button class="secondary" data-act="open">Open</button>
        <button class="secondary" data-act="delete">Delete</button>
      </div>`;
    item.querySelector('[data-act=open]').addEventListener('click', () => toggleTrailMap(m, true));
    item.querySelector('[data-act=delete]').addEventListener('click', async () => {
      if (confirm(`Delete "${m.name}"?`)) {
        toggleTrailMap(m, false);
        await dbDeleteTrailMap(m.id);
        renderTrailMapList();
      }
    });
    list.appendChild(item);
  });
}
function toggleTrailMap(m, on) {
  if (on) {
    if (!activeTrailLayers.has(m.id)) {
      const url = URL.createObjectURL(m.imageBlob);
      const initialOpacity = parseFloat(document.getElementById('trailOpacitySlider').value);
      const layer = L.imageOverlay.rotated(url, L.latLng(m.topLeft), L.latLng(m.topRight), L.latLng(m.bottomLeft), { opacity: initialOpacity });
      layer.addTo(map);
      activeTrailLayers.set(m.id, { layer, url });
      updateTrailOpacityBarVisibility();
    }
    // Always reveal/focus on "Open", even if this layer was already active
    // from a previous tap — otherwise a second tap silently does nothing.
    map.fitBounds(activeTrailLayers.get(m.id).layer.getBounds());
    regionListOverlay.classList.add('hidden');
  } else if (!on && activeTrailLayers.has(m.id)) {
    const { layer, url } = activeTrailLayers.get(m.id);
    map.removeLayer(layer);
    URL.revokeObjectURL(url);
    activeTrailLayers.delete(m.id);
    updateTrailOpacityBarVisibility();
  }
}

/* ---------- Init ---------- */
setMode('capture');

function setSwStatus(text, isErr) {
  const el = document.getElementById('swStatus');
  if (!el) return;
  el.textContent = text;
  el.className = isErr ? 'row err' : 'row muted';
}
if ('serviceWorker' in navigator) {
  setSwStatus('Offline support: registering…');
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').then(reg => {
      if (navigator.serviceWorker.controller) {
        setSwStatus('Offline support: ready');
      } else {
        setSwStatus('Offline support: installed — reload once more to activate it');
      }
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        nw && nw.addEventListener('statechange', () => {
          if (nw.state === 'activated') setSwStatus('Offline support: ready');
        });
      });
    }).catch(err => {
      setSwStatus('Offline support failed to register: ' + err.message, true);
    });
  });
} else {
  setSwStatus('Offline support: not available in this browser', true);
}
